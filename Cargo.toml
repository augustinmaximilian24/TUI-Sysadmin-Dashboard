[workspace]
resolver = "2"
members = ["core", "daemon", "gui", "proto"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "sync", "net", "io-util", "time", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
toml = "0.8"
regex = "1"
# chrono: für das Tageszeit-/Wochentagsprofil der Baselines (Phase 4) muss
# aus einem Unix-Zeitstempel die LOKALE Stunde und der Wochentag bestimmt
# werden. Die im Ökosystem übliche Alternative `time` verweigert das Lesen
# der System-Zeitzone in mehrthreadigen Prozessen ohne ein explizit als
# unsound markiertes Feature (`time::util::local_offset::set_soundness`).
# `chrono` liest die Zeitzone sicher über die libc.
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# redb: Persistenz der Baselines (Phase 4). Reines Rust ohne C-Toolchain
# (wichtig für Cross-Build auf den Haswell-Heimserver), Key/Value-Zugriff
# passt zum Muster "ganze Datensätze lesen/schreiben", siehe
# docs/phase4-baselines.md Abschnitt 6.1 für die Abwägung gegen rusqlite.
redb = "2"
# sysinfo: CPU/RAM/Load/Disk/Temperaturen (Phase 5). Reines Rust, liest
# /proc und /sys unter Linux, keine root-Rechte nötig für die hier
# genutzten Metriken.
sysinfo = "0.39"
# zbus: Status ausgewählter systemd-Units über D-Bus (Phase 5), statt
# Command::new("systemctl") zu parsen (verboten laut Regel 10 -- Aktionen
# müssen ohnehin über D-Bus/polkit laufen, Statusabfragen folgen demselben
# Weg statt zwei Zugriffsarten zu pflegen).
zbus = { version = "5", default-features = false, features = ["tokio"] }
