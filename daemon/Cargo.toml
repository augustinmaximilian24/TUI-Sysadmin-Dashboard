[package]
name = "logsentry-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "logsentry-daemon"
path = "src/main.rs"

[dependencies]
logsentry-core = { path = "../core" }
logsentry-proto = { path = "../proto" }
tokio.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
sysinfo.workspace = true
zbus.workspace = true
# nix: Auflösung des Gruppennamens aus der Konfiguration zu einer GID und
# chown der Socket-Datei (Regel 11). std::os::unix::fs::chown kann keine
# Gruppe nach Namen auflösen, nur nach GID -- dafür braucht es getgrnam,
# das nix bereitstellt. Einzige neue Abhängigkeit in Phase 6 (siehe
# docs/phase6-protokoll.md Abschnitt 2).
# Feature "signal" (Phase 8, Schritt 5): SIGTERM/SIGKILL für
# TerminateProcess, siehe docs/phase8-aktionen.md Abschnitt 6.
nix = { version = "0.29", default-features = false, features = ["user", "fs", "signal"] }
serde.workspace = true
serde_json.workspace = true
# reqwest (Phase-12-Erweiterung: Fritz!Box-Paketmitschnitt): Login
# (login_sid.lua) und dauerhaft offener Stream (capture_notimeout) über
# HTTP. Ohne TLS-Backend (default-features = false) -- die Fritz!Box-
# Diagnose-Endpunkte laufen im LAN üblicherweise über reines HTTP, ein
# TLS-Stack wäre hier unnötiges Gewicht. "stream"-Feature für
# `Response::bytes_stream()`, um den dauerhaften Mitschnitt-Stream zu lesen.
reqwest = { version = "0.13.5", default-features = false, features = ["stream"] }
# md-5 (Phase-12-Erweiterung): der Fritz!Box-Challenge-Response-Login
# verlangt zwingend MD5 (AVM-eigenes Protokoll, nicht verhandelbar) --
# RustCrypto-Implementierung statt Handrollen, da es sich um eine
# kryptografische Primitive handelt, nicht um Parsing-Logik.
md-5 = "0.11.0"
# futures-util (nur "std", kein "async-await"-Makro-Unterbau): liefert
# `StreamExt::next()`, um reqwest's `bytes_stream()` (den dauerhaft offenen
# Mitschnitt-Stream) zu konsumieren -- reqwests eigene Stream-API baut
# darauf auf, ein eigenes Poll-Interface nachzubauen waere unnoetig.
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }

[dev-dependencies]
tempfile = "3"
