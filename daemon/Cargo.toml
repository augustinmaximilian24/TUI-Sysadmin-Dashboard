[package]
name = "logsentry-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "logsentry-daemon"
path = "src/main.rs"

[dependencies]
logsentry-core = { path = "../core" }
logsentry-proto = { path = "../proto" }
tokio.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
sysinfo.workspace = true
zbus.workspace = true
# nix: Auflösung des Gruppennamens aus der Konfiguration zu einer GID und
# chown der Socket-Datei (Regel 11). std::os::unix::fs::chown kann keine
# Gruppe nach Namen auflösen, nur nach GID -- dafür braucht es getgrnam,
# das nix bereitstellt. Einzige neue Abhängigkeit in Phase 6 (siehe
# docs/phase6-protokoll.md Abschnitt 2).
nix = { version = "0.29", default-features = false, features = ["user", "fs"] }
# libc: `mode_t`-Cast für `bind_with_mode` (Regel 11, Abschnitt 5 Schritt 3).
libc = "0.2"
serde_json.workspace = true

[dev-dependencies]
tempfile = "3"
