[package]
name = "logsentry-gui"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "logsentry-gui"
path = "src/main.rs"

[dependencies]
logsentry-core = { path = "../core" }
logsentry-proto = { path = "../proto", features = ["client"] }
anyhow.workspace = true
tokio.workspace = true
# JSON-Export der Anomalien (Phase 10, optional).
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
eframe = "0.29"
# egui_plot: Live-Graph mit dynamischer Y-Achse (Phase 7, Regel: Live-Graph
# ohne feste Obergrenze). Version an `eframe`/`egui` 0.29 gekoppelt.
egui_plot = "0.29"
