[package]
name = "logsentry-proto"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# Für async Framing (proto::framing), das Daemon UND Client gleichermaßen
# nutzen -- daher keine optionale Abhängigkeit hinter einem Feature.
tokio.workspace = true

[features]
# proto::client (Schritt 3): Reconnect-Task, der Daemon selbst nicht
# braucht. tokio ist ab jetzt ohnehin immer vorhanden; dieses Feature
# schaltet nur das Modul frei, keine zusätzliche Dependency.
client = []

[[example]]
name = "tail"
required-features = ["client"]

[dev-dependencies]
tempfile = "3"
# tokio-test: nur für den FrameReader-Regressionstest, der einen Reader
# braucht, dessen Blöcke sich zeitversetzt liefern lassen (`io::Builder`),
# um einen Future-Abbruch mitten in einer mehrteiligen Zeile
# nachzustellen -- mit `tempfile::Cursor` allein nicht simulierbar.
tokio-test = "0.4.5"
