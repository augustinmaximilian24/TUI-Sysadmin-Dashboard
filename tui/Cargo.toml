[package]
name = "logsentry-tui"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "logsentry-tui"
path = "src/main.rs"

[dependencies]
logsentry-core = { path = "../core" }
logsentry-proto = { path = "../proto", features = ["client"] }
anyhow.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
# ratatui: zweiter Konsument desselben Protokolls für headless/SSH-Betrieb
# (Phase 10, optional; Ziel ist u. a. der Haswell-Heimserver ohne GUI).
# Re-exportiert `crossterm` selbst (`ratatui::crossterm`), damit keine
# eigene, möglicherweise abweichende crossterm-Version gepflegt werden muss.
ratatui = "0.29"
